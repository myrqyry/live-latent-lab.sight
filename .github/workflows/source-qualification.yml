name: Linux source qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sight-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates \
            xvfb xauth libgl1-mesa-dri qt6-base-dev qt6-base-private-dev qt6-svg-dev \
            extra-cmake-modules libsimde-dev uthash-dev uuid-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev libasound2-dev libjansson-dev libdrm-dev libegl-dev \
            libgl-dev libopengl-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-xinput-dev libglib2.0-dev zlib1g-dev libopencv-dev libtesseract-dev nlohmann-json3-dev
      - name: Prepare pinned OBS 32.2 SDK
        run: bash .github/scripts/prepare-obs32-sdk.sh "$RUNNER_TEMP/obs" 32.2.0
      - name: Build and verify source-only candidate
        env:
          SIGHT_OBS_SDK_ROOT: ${{ runner.temp }}/obs/sdk
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: bash tools/verify-clean-build.sh "$RUNNER_TEMP/sight-build"
      # No artifacts, packages, releases, or model downloads are published.
